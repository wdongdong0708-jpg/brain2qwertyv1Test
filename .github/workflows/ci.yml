name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  colab-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bootstrap test tools
        run: python -m pip install pytest
      - name: Colab setup tests
        run: python -m pytest tests/test_colab_setup.py -q
      - name: Repair a Python 3.13 venv without pip
        run: |
          python - <<'PY'
          import os
          import subprocess
          import venv
          from pathlib import Path
          from scripts.colab_setup import ensure_pip, prepare_environment

          fresh = prepare_environment(Path(os.environ["RUNNER_TEMP"]) / "colab-fresh")
          subprocess.run([str(fresh), "-m", "pip", "--version"], check=True)

          environment = Path(os.environ["RUNNER_TEMP"]) / "colab-no-pip"
          venv.EnvBuilder(with_pip=False).create(environment)
          python = environment / "bin/python"
          ensure_pip(python, environment)
          subprocess.run([str(python), "-m", "pip", "--version"], check=True)
          PY

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Both generations define ChannelPositions2D in neuralset's global registry.
      # They are independent packages and must be tested in separate processes.
      - name: V1 tests
        run: pytest tests/ --ignore=tests/test_v2_model.py --ignore=tests/test_v2_losses.py -v --tb=short

      - name: V2 tests
        run: pytest tests/test_v2_model.py tests/test_v2_losses.py -v --tb=short
